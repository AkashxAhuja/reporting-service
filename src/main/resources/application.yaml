spring:
  profiles:
    default: api # Use api, worker, or local to select the process role.
  application:
    name: reporting-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/reporting?serverSelectionTimeoutMS=3000&connectTimeoutMS=2000&socketTimeoutMS=10000}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:reporting}
    password: ${RABBITMQ_PASSWORD:reporting-local}
    virtual-host: ${RABBITMQ_VHOST:reporting}
    connection-timeout: 3s
    channel-rpc-timeout: 5s
    requested-heartbeat: 10s
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  address: 127.0.0.1
  port: ${PORT:8081}

reporting:
  reports:
    max-range-days: ${REPORT_MAX_RANGE_DAYS:731}

  # The role profiles control dispatch and worker activation.
  dispatch:
    poll-interval: ${REPORT_DISPATCH_POLL_INTERVAL:1s}
    lease-duration: ${REPORT_DISPATCH_LEASE_DURATION:30s}
    confirm-timeout: ${REPORT_DISPATCH_CONFIRM_TIMEOUT:5s}
    retry-delay: ${REPORT_DISPATCH_RETRY_DELAY:5s}
    batch-size: ${REPORT_DISPATCH_BATCH_SIZE:10}
    exchange: ${REPORT_DISPATCH_EXCHANGE:reporting.reports}
    queue: ${REPORT_DISPATCH_QUEUE:reporting.reports.jobs}
    routing-key: ${REPORT_DISPATCH_ROUTING_KEY:report.requested}

  # Read source rows in bounded pages using a SELECT-only account.
  worker:
    batch-size: ${REPORT_WORKER_BATCH_SIZE:500}
    lease-duration: 60s
    heartbeat-interval: 10s
    max-duration: ${REPORT_WORKER_MAX_DURATION:10m}
    query-timeout-seconds: 30
    jdbc-url: ${REPORT_MYSQL_URL:jdbc:mysql://localhost:3306/reporting_source}
    username: ${REPORT_MYSQL_USERNAME:report_reader}
    password: ${REPORT_MYSQL_PASSWORD:report-reader-local}

  # S3-compatible storage for completed CSVs and temporary download links.
  storage:
    endpoint: ${REPORT_S3_ENDPOINT:http://localhost:8333}
    region: ${REPORT_S3_REGION:us-east-1}
    bucket: ${REPORT_S3_BUCKET:reporting-exports}
    access-key: ${REPORT_S3_ACCESS_KEY:reporting}
    secret-key: ${REPORT_S3_SECRET_KEY:reporting-local-storage}
    path-style: ${REPORT_S3_PATH_STYLE:true}
    part-size-bytes: 8388608 # 8 MiB multipart buffer
    max-output-bytes: ${REPORT_MAX_OUTPUT_BYTES:53687091200} # 50 GiB per report
    download-ttl: 5m
